<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c1d" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseA {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes pulseB {
        0%, 100% { opacity: 0.25; transform: scale(1.05); }
        50% { opacity: 0.5; transform: scale(0.95); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-2deg); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitA {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .anim-pulse1 { animation: pulseA 8s ease-in-out infinite; transform-origin: 200px 120px; }
      .anim-pulse2 { animation: pulseB 10s ease-in-out infinite; transform-origin: 950px 160px; }
      .anim-float1 { animation: floatSlow1 6s ease-in-out infinite; }
      .anim-float2 { animation: floatSlow2 7s ease-in-out infinite; }
      .anim-flow { animation: flowDash 3s linear infinite; }
      .anim-orbit { animation: orbitA 35s linear infinite; transform-origin: 600px 210px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows -->
  <circle cx="220" cy="120" r="300" fill="url(#cyanGlow)" class="anim-pulse1" />
  <circle cx="980" cy="160" r="320" fill="url(#purpleGlow)" class="anim-pulse2" />
  <circle cx="600" cy="380" r="280" fill="url(#blueGlow)" />

  <!-- Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Background Animated Network Lines (behind content) -->
  <g opacity="0.45">
    <!-- Connecting constellation pathways -->
    <path d="M 100 80 Q 300 120 600 200 T 1100 120" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,6" class="anim-flow" />
    <path d="M 150 340 Q 400 260 600 200 T 1050 320" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,6" class="anim-flow" style="animation-direction: reverse;" />
    <path d="M 120 210 C 350 310, 850 110, 1080 210" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,8" class="anim-flow" />
  </g>

  <!-- Ambient Dynamic Floating Graphic Elements (Left & Right Flanks) -->
  <g class="anim-float1" opacity="0.8">
    <!-- Left Top: Document Model Icon Card -->
    <g transform="translate(70, 60)">
      <rect width="130" height="48" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="24" r="10" fill="#0284c7" fill-opacity="0.3" />
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">JSON</text>
      <text x="76" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Document</text>
    </g>

    <!-- Left Bottom: Graph Model Icon Card -->
    <g transform="translate(60, 290)">
      <rect width="125" height="48" rx="10" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="24" r="4" fill="#c084fc" />
      <circle cx="36" cy="18" r="3" fill="#38bdf8" />
      <circle cx="34" cy="30" r="3" fill="#34d399" />
      <line x1="22" y1="24" x2="36" y2="18" stroke="#a855f7" stroke-width="1.5" />
      <line x1="22" y1="24" x2="34" y2="30" stroke="#a855f7" stroke-width="1.5" />
      <text x="74" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Graph DB</text>
    </g>
  </g>

  <g class="anim-float2" opacity="0.8">
    <!-- Right Top: Vector Model Icon Card -->
    <g transform="translate(1000, 65)">
      <rect width="135" height="48" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="24" r="10" fill="#818cf8" fill-opacity="0.3" />
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#818cf8" text-anchor="middle">⚡</text>
      <text x="78" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Vector Search</text>
    </g>

    <!-- Right Bottom: Key-Value / Time-Series Icon Card -->
    <g transform="translate(1010, 295)">
      <rect width="130" height="48" rx="10" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="24" r="10" fill="#10b981" fill-opacity="0.3" />
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">🔑</text>
      <text x="76" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Key-Value</text>
    </g>
  </g>

  <!-- Foreground Content Area: Clear, High-Contrast, Prominent & Centered -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-115" cy="-1" r="5" fill="#10b981" />
    <text x="-95" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Banner Title -->
  <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    AWESOME <tspan fill="url(#titleGrad)">MULTI-MODEL</tspan> DATABASE
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
    Unified Engines • Polyglot Persistence • Graph, Document, Key-Value, Vector &amp; SQL
  </text>

  <!-- Interactive Data Model Badges Row -->
  <g transform="translate(600, 252)">
    <!-- Document Badge -->
    <g transform="translate(-325, 0)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="50" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">📄 Document</text>
    </g>
    <!-- Graph Badge -->
    <g transform="translate(-215, 0)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="45" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🕸️ Graph</text>
    </g>
    <!-- Vector Badge -->
    <g transform="translate(-115, 0)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <text x="46" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">🧠 Vector</text>
    </g>
    <!-- Key-Value Badge -->
    <g transform="translate(-13, 0)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="52" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🔑 Key-Value</text>
    </g>
    <!-- Relational Badge -->
    <g transform="translate(102, 0)">
      <rect x="0" y="0" width="102" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="51" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">🗄️ Relational</text>
    </g>
    <!-- Time-Series Badge -->
    <g transform="translate(214, 0)">
      <rect x="0" y="0" width="112" height="32" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
      <text x="56" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6" text-anchor="middle">⏱️ Time-Series</text>
    </g>
  </g>

  <!-- Bottom Spec Bar -->
  <g transform="translate(600, 335)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
      <tspan fill="#38bdf8">⚡ Single Engine ACID</tspan>  •  
      <tspan fill="#a855f7">🔗 Cross-Model Queries</tspan>  •  
      <tspan fill="#34d399">📦 Zero Polyglot Glue Code</tspan>  •  
      <tspan fill="#fbbf24">🌐 Cloud &amp; Open-Source</tspan>
    </text>
  </g>

  <!-- Subtle Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>